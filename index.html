<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>愉快仲間員工打卡</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      background: #f3f6f5;
      color: #20342c;
      font-family: -apple-system, sans-serif;
    }
    main {
      max-width: 440px;
      margin: 24px auto;
      padding: 28px 22px;
      background: white;
      border-radius: 20px;
      text-align: center;
    }
    h1 { font-size: 24px; }
    #status {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.8;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 24px;
    }
    button {
      padding: 18px 10px;
      border: 0;
      border-radius: 12px;
      background: #087f50;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }
    button:disabled {
      opacity: .45;
      cursor: default;
    }
    .secondary { background: #526760; }
    .wide {
      width: 100%;
      margin-top: 16px;
    }
    [hidden] { display: none !important; }
    .note {
      margin-top: 24px;
      color: #75827c;
      font-size: 13px;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main>
    <h1>愉快仲間員工打卡</h1>
    <p id="name"></p>
    <p id="status" role="status">正在確認帳號……</p>

    <button id="login" class="wide" hidden>
      使用 LINE 登入
    </button>

    <button id="check" class="wide secondary" hidden>
      重新確認開通狀態
    </button>

    <div id="buttons" class="grid" hidden>
      <button data-type="上班">上班</button>
      <button data-type="下班">下班</button>
      <button data-type="休息開始" class="secondary">
        休息開始
      </button>
      <button data-type="休息結束" class="secondary">
        休息結束
      </button>
    </div>

    <button id="retry" class="wide secondary" hidden>
      重試同一筆打卡
    </button>

    <p class="note">
      打卡時間以伺服器收到並儲存的時間為準。<br>
      目前尚未啟用定位檢查。<br>
      版本：出勤測試 1.0
    </p>
  </main>

  <script>
    const LIFF_ID = '2012178266-ti6J5alX';
    const PAGE_URL =
      'https://hiko-spec.github.io/yukai-attendance/';
    const API_URL =
      'https://script.google.com/macros/s/AKfycbwdBsaKp56i3E_5DBSOSb9CO7eyJ2STOjlyO3g7j1lqa1v7skQoTkxAsHgpccfCd9ec/exec';

    const statusEl = document.getElementById('status');
    const nameEl = document.getElementById('name');
    const loginBtn = document.getElementById('login');
    const checkBtn = document.getElementById('check');
    const retryBtn = document.getElementById('retry');
    const buttons = document.getElementById('buttons');

    let busy = false;
    let pending = null;

    function setBusy(value) {
      busy = value;
      document.querySelectorAll('button').forEach(function (b) {
        b.disabled = value;
      });
    }

    async function api(payload) {
      const idToken = liff.getIDToken();

      if (!idToken) {
        throw new Error('登入已失效，請關閉後重新開啟。');
      }

      const controller = new AbortController();
      const timer = setTimeout(function () {
        controller.abort();
      }, 45000);

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          credentials: 'omit',
          headers: {
            'Content-Type': 'text/plain;charset=UTF-8'
          },
          body: JSON.stringify({
            ...payload,
            idToken: idToken
          }),
          signal: controller.signal
        });

        if (!response.ok) {
          throw new Error('後端連線失敗：' + response.status);
        }

        let result;
        try {
          result = await response.json();
        } catch (_) {
          throw new Error(
            '後端未回傳預期資料，請確認部署與授權設定。'
          );
        }

        return result;

      } catch (error) {
        if (error.name === 'AbortError') {
          throw new Error('連線逾時。');
        }
        throw error;
      } finally {
        clearTimeout(timer);
      }
    }

    async function checkAccount() {
      if (busy) return;
      setBusy(true);
      statusEl.textContent = '正在確認員工開通狀態……';

      try {
        const result = await api({ action: 'me' });

        if (!result.ok) {
          throw new Error(result.message);
        }

        nameEl.textContent = result.name
          ? '你好，' + result.name
          : '';

        statusEl.textContent = result.message;
        buttons.hidden = !result.enabled;
        checkBtn.hidden = !!result.enabled;

      } catch (error) {
        statusEl.textContent = error.message;
        buttons.hidden = true;
        checkBtn.hidden = false;
      } finally {
        setBusy(false);
      }
    }

    async function sendPunch() {
      if (busy || !pending) return;
      setBusy(true);
      retryBtn.hidden = true;
      statusEl.textContent =
        '正在儲存「' + pending.type + '」……';

      try {
        const result = await api({
          action: 'punch',
          type: pending.type,
          requestId: pending.requestId
        });

        if (!result.ok || !result.enabled) {
          pending = null;
          statusEl.textContent = result.message;

          if (result.enabled === false) {
            buttons.hidden = true;
            checkBtn.hidden = false;
          }
          return;
        }

        statusEl.textContent =
          result.message + ' ✅\n' + result.time;
        pending = null;

      } catch (error) {
        statusEl.textContent =
          error.message +
          '\n尚未確認是否儲存成功。' +
          '\n請按「重試同一筆打卡」，避免重複新增。';
        retryBtn.hidden = false;
      } finally {
        setBusy(false);
        buttons.querySelectorAll('button').forEach(function (b) {
          b.disabled = !!pending;
        });
      }
    }

    buttons.querySelectorAll('button').forEach(function (b) {
      b.addEventListener('click', function () {
        if (busy || pending) return;

        const type = b.dataset.type;
        if (!window.confirm('確認進行「' + type + '」打卡？')) {
          return;
        }

        pending = {
          type: type,
          requestId: crypto.randomUUID()
        };
        sendPunch();
      });
    });

    checkBtn.addEventListener('click', checkAccount);
    retryBtn.addEventListener('click', sendPunch);

    loginBtn.addEventListener('click', function () {
      liff.login({ redirectUri: PAGE_URL });
    });

    async function start() {
      try {
        if (typeof liff === 'undefined') {
          throw new Error('LINE 元件載入失敗，請重新開啟。');
        }

        await liff.init({ liffId: LIFF_ID });

        if (!liff.isLoggedIn()) {
          statusEl.textContent = '請先登入 LINE。';
          loginBtn.hidden = false;
          return;
        }

        await checkAccount();

      } catch (error) {
        statusEl.textContent = error.message;
      }
    }

    start();
  </script>
</body>
</html>
